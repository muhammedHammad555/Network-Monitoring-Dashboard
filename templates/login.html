<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<style>
body{
font-family: Arial, sans-serif;
background-color: #1e293b;
color: white;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
}
.container{
background-color: #334155;
padding: 30px;
border-radius: 10px;
box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
width: 400px;
}
h2{
margin-bottom: 20px;
}
input{
width: 100%;
padding: 12px;
margin: 10px 0;
border-radius: 8px;
border: none;
background: #0f172a;
color: white;
}
button{
background: #2563eb;
color: white;
padding: 12px 20px;
border-radius: 10px;
width: 100%;
border: none;
cursor: pointer;
}
button:hover{
background: #1d4ed8;
}
.error{
color: red;
}
</style>
</head>
<body>

<div class="container">
<h2>Login</h2>

<form method="POST">
    <input type="password" name="password" placeholder="Enter Password" required>
    <button type="submit">Login</button>
</form>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

</div>

</body>
</html>
